<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>영어 플래시카드</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f4f3ef;
      --surface: #ffffff;
      --surface-2: #e9e8e2;
      --ink: #172126;
      --muted: #5c686b;
      --line: #ced2cf;
      --accent: #686868;
      --accent-strong: #4d4d4d;
      --accent-soft: #e5e5e5;
      --teal: #606060;
      --focus: #5f5f5f;
      --shadow: 0 3px 10px rgba(26, 32, 34, .10);
      --sheet-bg: #fbfbfb;
      --sheet-grid: #dedede;
      --sheet-head: #ededed;
      --sheet-head-2: #e2e2e2;
      --sheet-text: #4f4f4f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111719;
        --surface: #1b2427;
        --surface-2: #263033;
        --ink: #f4f4ef;
        --muted: #b2bebf;
        --line: #3c494c;
        --accent: #a6a6a6;
        --accent-strong: #d0d0d0;
        --accent-soft: #353535;
        --teal: #b8b8b8;
        --focus: #b0b0b0;
        --shadow: 0 3px 12px rgba(0, 0, 0, .28);
        --sheet-bg: #171717;
        --sheet-grid: #3d3d3d;
        --sheet-head: #282828;
        --sheet-head-2: #333333;
        --sheet-text: #d0d0d0;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body[data-background="notebook"] {
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 4.25rem,
        var(--paper);
    }
    body[data-background="sheet"] {
      background-color: var(--sheet-bg);
      background-image:
        linear-gradient(to right, var(--sheet-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--sheet-grid) 1px, transparent 1px);
      background-size: 88px 24px;
      background-position: 43px 108px;
    }
    .sheet-chrome {
      display: none;
      position: fixed;
      inset: 0 0 auto;
      z-index: 0;
      height: 108px;
      color: var(--sheet-text);
      background: var(--sheet-head);
      border-bottom: 1px solid #a8a8a8;
      font-family: "IBM Plex Sans", "Noto Sans KR", sans-serif;
      font-size: .72rem;
      user-select: none;
      pointer-events: none;
    }
    body[data-background="sheet"] .sheet-chrome { display: block; }
    .sheet-tabs {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 18px;
      overflow: hidden;
      white-space: nowrap;
      border-bottom: 1px solid #c5c5c5;
      background: var(--sheet-head-2);
    }
    .sheet-tabs span { flex: none; }
    .sheet-tabs span:nth-child(2) { font-weight: 700; border-bottom: 2px solid #777; height: 34px; display: flex; align-items: center; }
    .formula-row {
      height: 36px;
      display: grid;
      grid-template-columns: 62px 28px 1fr;
      align-items: center;
      gap: 0;
      padding: 4px 8px;
      background: var(--sheet-bg);
      border-bottom: 1px solid #bdbdbd;
    }
    .name-box, .formula-box {
      height: 27px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      background: var(--sheet-bg);
      border: 1px solid #bdbdbd;
    }
    .formula-mark { text-align: center; font-family: Georgia, serif; font-style: italic; font-size: .9rem; }
    .column-heads {
      height: 38px;
      display: grid;
      grid-template-columns: 43px repeat(10, minmax(72px, 88px));
      overflow: hidden;
      background: var(--sheet-head);
    }
    .column-heads span {
      display: grid;
      place-items: center;
      border-right: 1px solid #bdbdbd;
    }
    .column-heads span:first-child { background: var(--sheet-head-2); }
    button, select { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 940px);
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
      position: relative;
      z-index: 1;
    }
    body[data-background="sheet"] .app {
      padding-top: max(132px, calc(108px + env(safe-area-inset-top)));
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: clamp(28px, 7vh, 72px);
    }
    .source-count {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .source-count strong {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: .95rem;
      color: var(--accent);
      font-weight: 600;
    }
    .source-count span { color: var(--muted); font-size: .82rem; white-space: nowrap; }
    .settings {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }
    .setting {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .setting-label {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 600;
    }
    .deck-select {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      padding: 7px 26px 8px 2px;
      font-size: .86rem;
      font-weight: 600;
      cursor: pointer;
    }
    .setting.background { width: 142px; }
    .setting.direction { width: 148px; }
    .setting.deck { width: min(32vw, 230px); }
    .deck-select:focus-visible, button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
      outline-offset: 3px;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 164px;
      gap: 16px;
      align-items: stretch;
    }
    .card-wrap { min-width: 0; }
    .card-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 600;
    }
    .card-meta span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta-right {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
    }
    .level {
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: .68rem;
    }
    .count { font-family: "IBM Plex Sans", sans-serif; white-space: nowrap; }
    .flashcard {
      width: 100%;
      min-height: 292px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      padding: clamp(26px, 4vw, 40px);
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .flashcard::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
    }
    .prompt-text {
      display: block;
      margin: auto 0;
      color: var(--ink);
      font-family: "IBM Plex Sans", "Noto Sans KR", sans-serif;
      font-size: clamp(1.65rem, 3.8vw, 2.75rem);
      line-height: 1.15;
      letter-spacing: -.035em;
      font-weight: 500;
      text-wrap: balance;
    }
    .prompt-text.ko {
      font-family: "Noto Sans KR", sans-serif;
      font-size: clamp(1.45rem, 3.3vw, 2.25rem);
      line-height: 1.38;
      letter-spacing: -.025em;
      font-weight: 600;
    }
    .answer { display: none; }
    .flashcard.revealed .answer {
      display: block;
      margin-top: 28px;
    }
    .answer-text {
      display: block;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--teal);
      font-size: clamp(1.05rem, 2.3vw, 1.35rem);
      line-height: 1.65;
      font-weight: 600;
    }
    .answer-text.en {
      font-family: "IBM Plex Sans", "Noto Sans KR", sans-serif;
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      line-height: 1.35;
    }
    .card-cue {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 500;
    }
    .card-cue svg { width: 17px; height: 17px; flex: none; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: flex-end;
    }
    .action {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 11px;
      background: var(--surface);
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .action svg { width: 17px; height: 17px; flex: none; }
    .action:hover { border-color: var(--muted); background: var(--surface-2); }
    .action.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .action.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    body[data-background="sheet"] .flashcard {
      min-height: 270px;
      border-color: #b9b9b9;
      border-radius: 2px;
      box-shadow: 1px 2px 5px rgba(0, 0, 0, .08);
      background: color-mix(in srgb, var(--sheet-bg) 96%, var(--sheet-head));
    }
    body[data-background="sheet"] .flashcard::before { width: 2px; background: #8a8a8a; }
    body[data-background="sheet"] .action {
      border-color: #b9b9b9;
      border-radius: 2px;
      background: var(--sheet-head);
      color: var(--sheet-text);
      box-shadow: 1px 1px 2px rgba(0, 0, 0, .06);
    }
    body[data-background="sheet"] .action:hover { background: var(--sheet-head-2); border-color: #8f8f8f; }
    body[data-background="sheet"] .action.primary { background: #707070; color: #fff; border-color: #5f5f5f; }
    body[data-background="sheet"] .action.primary:hover { background: #5b5b5b; border-color: #4c4c4c; }
    body[data-background="sheet"] .level {
      border: 1px solid #bcbcbc;
      border-radius: 2px;
      background: var(--sheet-head);
      color: var(--sheet-text);
    }
    .action.listen { color: var(--teal); }
    .action[disabled] { opacity: .42; cursor: not-allowed; background: var(--surface); border-color: var(--line); }

    .hint {
      margin: 28px 2px 0;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.55;
    }
    .hint kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      text-align: center;
    }
    .status {
      min-height: 1.4em;
      margin: 14px 2px 0;
      color: var(--accent-strong);
      font-size: .8rem;
      font-weight: 600;
    }
    .loading {
      min-height: 390px;
      border: 1px solid var(--line);
      border-radius: 26px 26px 26px 8px;
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      body[data-background="notebook"] { background-size: 100% 3.5rem; }
      body[data-background="sheet"] { background-size: 72px 24px; background-position: 43px 108px; }
      .sheet-tabs { gap: 16px; padding-inline: 12px; font-size: .64rem; }
      .app { padding-left: 18px; padding-right: 18px; }
      .topline { align-items: flex-start; flex-direction: column; gap: 16px; margin-bottom: 28px; }
      .source-count { flex-direction: row; gap: 8px; }
      .settings { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .setting.background, .setting.direction, .setting.deck { width: 100%; }
      .stage { grid-template-columns: 1fr; gap: 18px; }
      .flashcard { min-height: 250px; padding: 22px 20px; border-radius: 5px; }
      body[data-background="sheet"] .flashcard { min-height: 230px; border-radius: 2px; }
      .prompt-text { font-size: clamp(1.5rem, 7vw, 2.15rem); }
      .prompt-text.ko { font-size: clamp(1.35rem, 6vw, 1.9rem); }
      .actions { display: grid; grid-template-columns: 1fr 1.2fr; }
      .action { justify-content: center; min-height: 46px; }
      .hint { margin-top: 20px; }
    }
    @media (max-width: 390px) {
      .settings { grid-template-columns: 1fr; }
      .flashcard { min-height: 380px; }
      .actions { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-background="sheet">
  <div class="sheet-chrome" aria-hidden="true">
    <div class="sheet-tabs"><span>파일</span><span>홈</span><span>삽입</span><span>페이지 레이아웃</span><span>수식</span><span>데이터</span><span>검토</span><span>보기</span></div>
    <div class="formula-row"><span class="name-box">B4</span><span class="formula-mark">fx</span><span class="formula-box"></span></div>
    <div class="column-heads"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span></div>
  </div>
  <main class="app">
    <div class="topline">
      <div class="source-count" aria-live="polite">
        <strong id="totalCount">1,200문장</strong>
        <span>7개 학습 자료</span>
      </div>
      <div class="settings" aria-label="학습 옵션">
        <label class="setting background">
          <span class="setting-label">화면 배경</span>
          <select id="backgroundSelect" class="deck-select" aria-label="화면 배경 선택">
            <option value="sheet" selected>엑셀 업무 화면</option>
            <option value="notebook">기존 노트 배경</option>
          </select>
        </label>
        <label class="setting direction">
          <span class="setting-label">먼저 볼 문장</span>
          <select id="directionSelect" class="deck-select" aria-label="먼저 볼 언어 선택">
            <option value="ko-first" selected>한국어 → 영어</option>
            <option value="en-first">영어 → 한국어</option>
          </select>
        </label>
        <label class="setting deck">
          <span class="setting-label">학습 자료</span>
          <select id="deckSelect" class="deck-select" aria-label="학습 자료 선택">
            <option value="all">전체 자료</option>
          </select>
        </label>
      </div>
    </div>

    <section id="loading" class="loading" aria-live="polite">문장 카드를 준비하고 있어요.</section>

    <section id="study" class="stage" hidden aria-label="영어 문장 학습">
      <div class="card-wrap">
        <div class="card-meta">
          <span id="deckName"></span>
          <span class="meta-right"><span id="level" class="level"></span><span id="cardCount" class="count"></span></span>
        </div>
        <button id="flashcard" class="flashcard" type="button" aria-expanded="false">
          <span id="promptText" class="prompt-text"></span>
          <span id="answer" class="answer" aria-hidden="true">
            <span id="answerText" class="answer-text"></span>
          </span>
          <span id="cardCue" class="card-cue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="9"/></svg>
            카드를 눌러 영어 보기
          </span>
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>

      <div class="actions">
        <button id="listenBtn" class="action listen" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.8 8.4H3v7.2h3.8L11 19V5Z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>
          영어 듣기
        </button>
        <button id="nextBtn" class="action primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
          다음 문장
        </button>
      </div>
    </section>

    <p class="hint"><kbd>Space</kbd> 답 보기 · <kbd>N</kbd> 다음 문장 · 쉬운 표현부터 점차 난이도가 올라갑니다. 답을 본 뒤 카드를 한 번 더 누르면 영어가 재생됩니다.</p>
  </main>

  <audio id="player" preload="none"></audio>

  <script>
    (function () {
      'use strict';
      var cards = [];
      var pool = [];
      var current = null;
      var currentIndex = -1;
      var revealed = false;
      var drawPile = [];
      var roundPosition = 0;
      var playbackGeneration = 0;
      var clipCache = new Map();
      var clipPromises = new Map();
      var deckPromises = new Map();
      var activeClipUrl = '';
      var MAX_CACHED_CLIPS = 16;

      var els = {
        loading: document.getElementById('loading'),
        study: document.getElementById('study'),
        deckSelect: document.getElementById('deckSelect'),
        directionSelect: document.getElementById('directionSelect'),
        backgroundSelect: document.getElementById('backgroundSelect'),
        totalCount: document.getElementById('totalCount'),
        deckName: document.getElementById('deckName'),
        level: document.getElementById('level'),
        cardCount: document.getElementById('cardCount'),
        flashcard: document.getElementById('flashcard'),
        promptText: document.getElementById('promptText'),
        answer: document.getElementById('answer'),
        answerText: document.getElementById('answerText'),
        cardCue: document.getElementById('cardCue'),
        listenBtn: document.getElementById('listenBtn'),
        nextBtn: document.getElementById('nextBtn'),
        player: document.getElementById('player'),
        status: document.getElementById('status')
      };

      function formatNumber(n) {
        return new Intl.NumberFormat('ko-KR').format(n);
      }

      function difficultyLabel(card) {
        var words = card.en.trim().split(/\s+/).length;
        if (words <= 7) return '쉬움';
        if (words <= 10) return '보통';
        return '도전';
      }

      function refillDrawPile() {
        drawPile = pool.slice();
        for (var i = drawPile.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = drawPile[i];
          drawPile[i] = drawPile[j];
          drawPile[j] = temp;
        }
        var easy = drawPile.filter(function (card) { return difficultyLabel(card) === '쉬움'; });
        var medium = drawPile.filter(function (card) { return difficultyLabel(card) === '보통'; });
        var challenge = drawPile.filter(function (card) { return difficultyLabel(card) === '도전'; });
        drawPile = challenge.concat(medium, easy);
        roundPosition = 0;
      }

      function shufflePick() {
        if (!pool.length) return null;
        if (!drawPile.length) refillDrawPile();
        roundPosition += 1;
        return drawPile.pop();
      }

      function finishAudio() {
        els.player.pause();
        els.listenBtn.classList.remove('playing');
        els.listenBtn.lastChild.textContent = ' 영어 듣기';
      }

      function stopAudio() {
        playbackGeneration += 1;
        finishAudio();
      }

      function clipKey(card) {
        return [card.audioDeckFile, card.audioDeckByteStart, card.audioByteLength].join(':');
      }

      function ensureDeckBuffer(deckFile) {
        if (deckPromises.has(deckFile)) return deckPromises.get(deckFile);

        var request = fetch('assets/flashcards-deck-' + deckFile + '.mp3')
          .then(function (response) {
            if (!response.ok) throw new Error('audio');
            return response.arrayBuffer();
          });
        deckPromises.set(deckFile, request);
        request.then(function () {
          deckPromises.delete(deckFile);
        }, function () {
          deckPromises.delete(deckFile);
        });
        return request;
      }

      function readAudioClip(card) {
        var byteStart = Number(card.audioDeckByteStart);
        var byteLength = Number(card.audioByteLength);
        if (!Number.isFinite(byteStart) || !Number.isFinite(byteLength) || byteStart < 0 || byteLength <= 0) {
          return Promise.reject(new Error('audio-metadata'));
        }

        var key = clipKey(card);
        if (clipCache.has(key)) {
          var cachedUrl = clipCache.get(key);
          clipCache.delete(key);
          clipCache.set(key, cachedUrl);
          return Promise.resolve(cachedUrl);
        }
        if (clipPromises.has(key)) return clipPromises.get(key);

        var request = ensureDeckBuffer(card.audioDeckFile).then(function (buffer) {
          if (byteStart + byteLength > buffer.byteLength) throw new Error('audio-metadata');
          var clipBytes = buffer.slice(byteStart, byteStart + byteLength);
          var url = URL.createObjectURL(new Blob([clipBytes], { type: 'audio/mpeg' }));
          clipCache.set(key, url);
          while (clipCache.size > MAX_CACHED_CLIPS) {
